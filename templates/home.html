<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qaḍiyya | قضية</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='qadiyya_favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
    <script src="{{ url_for('static', filename='home.js') }}"></script>
</head>

<body>

  <main class="home-wrapper">

    <!-- Basmala -->
    <div class="home-basmala">﷽</div>

    <!-- Ornamental rule -->
    <div class="ornamental-rule"><span>✦</span></div>

    <!-- Title -->
    <div class="home-title-block">
      <h1 class="home-title">
        Qaḍiyya
        <span class="home-title-arabic">قضية</span>
      </h1>
      <p class="home-subtitle">an interactive tool for classical argument mapping</p>
    </div>

    <!-- Divider -->
    <div class="home-divider"></div>

    <!-- Buttons -->
    <div class="home-buttons">
      <button class="home-btn home-btn-secondary" onclick="openProject()">My Arguments</button>
      <button class="home-btn home-btn-primary"   onclick="newProject()">New Argument</button>
    </div>

  </main>

  <!-- Footer credit -->
  <p class="home-credit">Nooh Alavi (نوح بن أحمد كاشف العلوي) &nbsp;·&nbsp; 2025 &nbsp;·&nbsp; <a href="https://github.com/NoohAlavi/Qadiyya/" target="_blank" style="color: inherit; opacity: 0.7; text-decoration: none; transition: opacity 0.2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.7">GitHub</a></p>

  <!-- New Argument Modal -->
  <div class="form-popup" id="myForm">
    <div class="form-container">
      <h2>New Argument</h2>

      <label for="title">Argument Title</label>
      <input type="text" placeholder="What is the argument trying to prove?" id="title">

      <button class="btn btn-create" onclick="createNewProject(event)">Create Argument</button>
      <button class="btn btn-cancel" onclick="closeForm()">Cancel</button>
    </div>
  </div>

</body>
</html>
