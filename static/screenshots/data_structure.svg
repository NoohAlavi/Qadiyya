<svg width="760" height="760" viewBox="0 0 760 760" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9a8060" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="760" fill="#f5f0e8"/>

  <!-- ── Layer 1: Session file ── -->
  <rect x="30" y="30" width="700" height="62" rx="12" fill="#ede6d6" stroke="#9a8060" stroke-width="1"/>
  <text x="380" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1410">sessions/&lt;session_id&gt;.json</text>
  <text x="380" y="75" text-anchor="middle" font-size="12" fill="#6b5d50">one file per browser · persists across refreshes</text>

  <line x1="380" y1="92" x2="380" y2="112" stroke="#9a8060" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Layer 2: Projects dict ── -->
  <rect x="30" y="112" width="700" height="62" rx="12" fill="#e8e4f5" stroke="#7f77dd" stroke-width="1"/>
  <text x="380" y="137" text-anchor="middle" font-size="14" font-weight="bold" fill="#26215c">projects: { "&lt;uuid&gt;": Project, ... }</text>
  <text x="380" y="157" text-anchor="middle" font-size="12" fill="#534ab7">multiple arguments per session · current_project: "&lt;uuid&gt;"</text>

  <line x1="380" y1="174" x2="380" y2="194" stroke="#9a8060" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Layer 3: MantiqMap ── -->
  <rect x="30" y="194" width="700" height="62" rx="12" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
  <text x="380" y="219" text-anchor="middle" font-size="14" font-weight="bold" fill="#04342c">MantiqMap</text>
  <text x="380" y="239" text-anchor="middle" font-size="12" fill="#0f6e56">title · numbering · chart representation · serialization</text>

  <line x1="380" y1="256" x2="380" y2="276" stroke="#9a8060" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Layer 4: Root Node (centered) ── -->
  <rect x="220" y="276" width="320" height="62" rx="12" fill="#faeeda" stroke="#ba7517" stroke-width="1"/>
  <text x="380" y="301" text-anchor="middle" font-size="14" font-weight="bold" fill="#412402">Root Node (Conclusion)</text>
  <text x="380" y="321" text-anchor="middle" font-size="12" fill="#854f0b">is_root: true · barebones · written_premise</text>

  <!-- arrows to P1 (center=140), P2 (center=380), P3 (center=620) -->
  <line x1="310" y1="338" x2="140" y2="390" stroke="#9a8060" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="380" y1="338" x2="380" y2="390" stroke="#9a8060" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="338" x2="620" y2="390" stroke="#9a8060" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Layer 5: P1 (x=30, w=220, center=140) ── -->
  <rect x="30" y="390" width="220" height="110" rx="12" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
  <text x="140" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#042c53">Node (P1)</text>
  <text x="140" y="432" text-anchor="middle" font-size="11" fill="#185fa5">barebones: { parent, child }</text>
  <text x="140" y="449" text-anchor="middle" font-size="11" fill="#185fa5">metadata: {</text>
  <text x="140" y="465" text-anchor="middle" font-size="11" fill="#185fa5">  premise_type, annotations }</text>
  <text x="140" y="482" text-anchor="middle" font-size="11" fill="#185fa5">premises: [ ]</text>

  <!-- ── Layer 5: P2 inferential (x=270, w=220, center=380) ── -->
  <rect x="270" y="390" width="220" height="110" rx="12" fill="#faece7" stroke="#993c1d" stroke-width="1"/>
  <text x="380" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a1b0c">Node (P2 — inferential)</text>
  <text x="380" y="432" text-anchor="middle" font-size="11" fill="#993c1d">barebones: { parent, child }</text>
  <text x="380" y="449" text-anchor="middle" font-size="11" fill="#993c1d">metadata: {</text>
  <text x="380" y="465" text-anchor="middle" font-size="11" fill="#993c1d">  premise_type, annotations }</text>
  <text x="380" y="482" text-anchor="middle" font-size="11" fill="#993c1d">premises: [ P3, P4 ]</text>

  <!-- ── Layer 5: P3 (x=510, w=220, center=620) ── -->
  <rect x="510" y="390" width="220" height="110" rx="12" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
  <text x="620" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#042c53">Node (P3)</text>
  <text x="620" y="432" text-anchor="middle" font-size="11" fill="#185fa5">barebones: { parent, child }</text>
  <text x="620" y="449" text-anchor="middle" font-size="11" fill="#185fa5">metadata: {</text>
  <text x="620" y="465" text-anchor="middle" font-size="11" fill="#185fa5">  premise_type, annotations }</text>
  <text x="620" y="482" text-anchor="middle" font-size="11" fill="#185fa5">premises: [ ]</text>

  <!-- arrows from P2 down to P4 (center=255) and P5 (center=505) -->
  <line x1="340" y1="500" x2="255" y2="560" stroke="#9a8060" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="420" y1="500" x2="505" y2="560" stroke="#9a8060" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Layer 6: P4 (x=150, w=210, center=255) ── -->
  <rect x="150" y="560" width="210" height="62" rx="12" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
  <text x="255" y="585" text-anchor="middle" font-size="13" font-weight="bold" fill="#042c53">Node (P4)</text>
  <text x="255" y="605" text-anchor="middle" font-size="11" fill="#185fa5">self-evident premise</text>

  <!-- ── Layer 6: P5 (x=400, w=210, center=505) ── -->
  <rect x="400" y="560" width="210" height="62" rx="12" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
  <text x="505" y="585" text-anchor="middle" font-size="13" font-weight="bold" fill="#042c53">Node (P5)</text>
  <text x="505" y="605" text-anchor="middle" font-size="11" fill="#185fa5">self-evident premise</text>

  <!-- ── Legend ── -->
  <rect x="30" y="658" width="12" height="12" rx="3" fill="#faeeda" stroke="#ba7517"/>
  <text x="48" y="669" font-size="11" fill="#3d3228">conclusion / root</text>

  <rect x="178" y="658" width="12" height="12" rx="3" fill="#faece7" stroke="#993c1d"/>
  <text x="196" y="669" font-size="11" fill="#3d3228">inferential premise</text>

  <rect x="346" y="658" width="12" height="12" rx="3" fill="#e6f1fb" stroke="#185fa5"/>
  <text x="364" y="669" font-size="11" fill="#3d3228">non-inferential premise</text>

  <rect x="556" y="658" width="12" height="12" rx="3" fill="#e1f5ee" stroke="#0f6e56"/>
  <text x="574" y="669" font-size="11" fill="#3d3228">MantiqMap</text>

</svg>
